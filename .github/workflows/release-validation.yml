name: "Release Validation"

on:
  pull_request:
    branches: [ "main", "master", "develop", "development" ]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: intermix-release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select representative acceptance checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      acceptance: ${{ steps.changed.outputs.acceptance }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect acceptance inputs
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files=$(git diff --name-only "$BASE_SHA" HEAD -- \
            src composer.json benchmarks/HostAcceptance.php benchmarks/HostAcceptanceCompare.php \
            .github/workflows/release-validation.yml)
          if [[ -n "$changed_files" ]]; then
            echo "acceptance=true" >> "$GITHUB_OUTPUT"
          fi

  host-acceptance:
    needs: changes
    if: always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.acceptance == 'true')
    name: "Host acceptance - PHP ${{ matrix.php-version }} - ${{ matrix.mode }} - c${{ matrix.concurrency }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
        mode: ["dynamic"]
        concurrency: [1, 8, 32, 64]
        include:
          - php-version: "8.4"
            mode: "production"
            concurrency: 32
          - php-version: "8.5"
            mode: "production"
            concurrency: 32
          - php-version: "8.4"
            mode: "hybrid"
            concurrency: 32
          - php-version: "8.5"
            mode: "hybrid"
            concurrency: 32
    steps:
      - name: Checkout InterMix candidate
        uses: actions/checkout@v7
        with:
          path: current
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout InterMix 10.1.1 baseline
        uses: actions/checkout@v7
        with:
          repository: infocyph/InterMix
          ref: "f687452b9b8d10333e7beb7d6905b479b2b8480e"
          path: baseline

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: |
          composer install --working-dir=baseline --no-dev --no-interaction --prefer-dist --no-progress --classmap-authoritative
          composer install --working-dir=current --no-dev --no-interaction --prefer-dist --no-progress --classmap-authoritative

      - name: Measure seven alternating host pairs
        shell: bash
        env:
          CONCURRENCY: ${{ matrix.concurrency }}
          MODE: ${{ matrix.mode }}
        run: |
          baseline_files=()
          current_files=()

          measure_baseline() {
            php current/benchmarks/HostAcceptance.php \
              --autoload="$GITHUB_WORKSPACE/baseline/vendor/autoload.php" \
              --duration=30 \
              --concurrency="$CONCURRENCY" \
              --mode="$MODE" \
              --output="$1"
          }

          measure_current() {
            php current/benchmarks/HostAcceptance.php \
              --autoload="$GITHUB_WORKSPACE/current/vendor/autoload.php" \
              --duration=30 \
              --concurrency="$CONCURRENCY" \
              --mode="$MODE" \
              --output="$1"
          }

          for iteration in 1 2 3 4 5 6 7; do
            baseline_file="$RUNNER_TEMP/host-baseline-${{ matrix.php-version }}-$MODE-$CONCURRENCY-$iteration.json"
            current_file="$RUNNER_TEMP/host-current-${{ matrix.php-version }}-$MODE-$CONCURRENCY-$iteration.json"
            baseline_files+=("$baseline_file")
            current_files+=("$current_file")

            if (( iteration % 2 == 1 )); then
              measure_baseline "$baseline_file"
              measure_current "$current_file"
            else
              measure_current "$current_file"
              measure_baseline "$baseline_file"
            fi
          done

          (IFS=,; echo "HOST_BASELINE_FILES=${baseline_files[*]}" >> "$GITHUB_ENV")
          (IFS=,; echo "HOST_CURRENT_FILES=${current_files[*]}" >> "$GITHUB_ENV")

      - name: Measure balanced five-minute baseline and candidate pairs
        shell: bash
        env:
          CONCURRENCY: ${{ matrix.concurrency }}
          MODE: ${{ matrix.mode }}
        run: |
          baseline_long_files=()
          current_long_files=()

          measure_baseline_long() {
            php current/benchmarks/HostAcceptance.php \
              --autoload="$GITHUB_WORKSPACE/baseline/vendor/autoload.php" \
              --duration=300 \
              --concurrency="$CONCURRENCY" \
              --mode="$MODE" \
              --output="$1"
          }

          measure_current_long() {
            php current/benchmarks/HostAcceptance.php \
              --autoload="$GITHUB_WORKSPACE/current/vendor/autoload.php" \
              --duration=300 \
              --concurrency="$CONCURRENCY" \
              --mode="$MODE" \
              --output="$1"
          }

          for iteration in 1 2; do
            baseline_long="$RUNNER_TEMP/host-baseline-long-${{ matrix.php-version }}-$MODE-$CONCURRENCY-$iteration.json"
            current_long="$RUNNER_TEMP/host-current-long-${{ matrix.php-version }}-$MODE-$CONCURRENCY-$iteration.json"
            baseline_long_files+=("$baseline_long")
            current_long_files+=("$current_long")

            if (( iteration % 2 == 1 )); then
              measure_baseline_long "$baseline_long"
              measure_current_long "$current_long"
            else
              measure_current_long "$current_long"
              measure_baseline_long "$baseline_long"
            fi
          done

          (IFS=,; echo "HOST_BASELINE_LONG=${baseline_long_files[*]}" >> "$GITHUB_ENV")
          (IFS=,; echo "HOST_CURRENT_LONG=${current_long_files[*]}" >> "$GITHUB_ENV")

      - name: Enforce representative host acceptance
        run: |
          php current/benchmarks/HostAcceptanceCompare.php \
            --baseline="$HOST_BASELINE_FILES" \
            --current="$HOST_CURRENT_FILES" \
            --baseline-long="$HOST_BASELINE_LONG" \
            --current-long="$HOST_CURRENT_LONG" \
            --max-rpm-regression=2

      - name: Upload host acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-acceptance-php-${{ matrix.php-version }}-${{ matrix.mode }}-c${{ matrix.concurrency }}
          path: ${{ runner.temp }}/host-*.json
          retention-days: 61

  persistent-soak:
    needs: changes
    if: always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.acceptance == 'true')
    name: "Persistent soak - PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --classmap-authoritative

      - name: Run 30-minute persistent-host soak
        run: |
          php benchmarks/HostAcceptance.php \
            --autoload="$GITHUB_WORKSPACE/vendor/autoload.php" \
            --duration=1800 \
            --concurrency=32 \
            --mode=dynamic \
            --soak \
            --output="$RUNNER_TEMP/host-soak-${{ matrix.php-version }}.json"

      - name: Enforce soak resource and correctness ceilings
        run: |
          php benchmarks/HostAcceptanceCompare.php \
            --assert-soak="$RUNNER_TEMP/host-soak-${{ matrix.php-version }}.json" \
            --max-rss-growth-mb=8 \
            --max-php-growth-mb=4

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-soak-php-${{ matrix.php-version }}
          path: ${{ runner.temp }}/host-soak-${{ matrix.php-version }}.json
          retention-days: 61


  provider-acceptance:
    needs: changes
    if: always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.acceptance == 'true')
    name: "Provider acceptance - PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: apcu, pdo_sqlite
          ini-values: apc.enable_cli=1
          tools: composer:v2
          coverage: none

      - name: Install provider test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --classmap-authoritative

      - name: Assert advertised providers are installed
        run: |
          php -r 'require "vendor/autoload.php"; exit(
            class_exists(\Infocyph\Runwire\RuntimeContext::class)
            && class_exists(\Infocyph\CacheLayer\Cache\Cache::class)
            ? 0 : 1
          );'

      - name: Exercise Runwire and CacheLayer host boundaries
        run: composer ic:test:code

  source-inventory:
    needs: changes
    if: always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.acceptance == 'true')
    name: Release source inventory
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: current
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/checkout@v7
        with:
          repository: infocyph/InterMix
          ref: "f687452b9b8d10333e7beb7d6905b479b2b8480e"
          path: baseline

      - name: Record before/after production surface
        shell: bash
        run: |
          {
            echo "baseline_sha=$(git -C baseline rev-parse HEAD)"
            echo "current_sha=$(git -C current rev-parse HEAD)"
            echo "baseline_php_files=$(find baseline/src -type f -name '*.php' | wc -l)"
            echo "current_php_files=$(find current/src -type f -name '*.php' | wc -l)"
            echo "baseline_public_methods=$(grep -R -h -E '^[[:space:]]*public (static )?function ' baseline/src --include='*.php' | wc -l)"
            echo "current_public_methods=$(grep -R -h -E '^[[:space:]]*public (static )?function ' current/src --include='*.php' | wc -l)"
            echo "baseline_source_bytes=$(du -sb baseline/src | cut -f1)"
            echo "current_source_bytes=$(du -sb current/src | cut -f1)"
          } | tee "$RUNNER_TEMP/intermix-release-inventory.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: intermix-release-inventory
          path: ${{ runner.temp }}/intermix-release-inventory.txt
          retention-days: 61

  package:
    name: Release package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Build release archive
        shell: bash
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/intermix-release.tar.gz" HEAD
          mkdir "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/intermix-release.tar.gz" -C "$RUNNER_TEMP/release"
          for excluded in .agents .aws .codex .github benchmarks docs graphify-out static-analysis tests var vendor composer.lock; do
            test ! -e "$RUNNER_TEMP/release/$excluded"
          done
          test -f "$RUNNER_TEMP/release/composer.json"
          test -d "$RUNNER_TEMP/release/src"

      - name: Install and smoke release archive
        shell: bash
        run: |
          composer install \
            --working-dir="$RUNNER_TEMP/release" \
            --no-dev --no-interaction --prefer-dist --no-progress --classmap-authoritative
          php -r '
            require getenv("RUNNER_TEMP") . "/release/vendor/autoload.php";
            $runtime = \Infocyph\InterMix\DI\ContainerBuilder::create("release.archive")
                ->value("answer", 42)
                ->build();
            if ($runtime->get("answer") !== 42) {
                throw new RuntimeException("Release archive smoke failed.");
            }
          '

      - uses: actions/upload-artifact@v7
        with:
          name: intermix-release-archive
          path: ${{ runner.temp }}/intermix-release.tar.gz
          retention-days: 61

  consumer-install:
    name: "Consumer install - ${{ matrix.integration }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        integration: ["core", "cachelayer", "runwire", "opis"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: current
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Create clean consumer
        shell: bash
        run: |
          mkdir consumer
          cd consumer
          composer init --name=intermix/release-consumer --no-interaction
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config repositories.intermix path "$GITHUB_WORKSPACE/current"
          composer require infocyph/intermix:@dev --no-interaction --prefer-dist --no-progress
          case "${{ matrix.integration }}" in
            cachelayer) composer require infocyph/cachelayer:^4.0.2 --no-interaction --prefer-dist --no-progress ;;
            runwire) composer require infocyph/runwire:^3.0 --no-interaction --prefer-dist --no-progress ;;
            opis) composer require opis/closure:^4.5 --no-interaction --prefer-dist --no-progress ;;
          esac
          composer dump-autoload --classmap-authoritative --no-interaction

      - name: Validate clean consumer
        shell: bash
        run: |
          cd consumer
          php -r '
            require "vendor/autoload.php";
            $runtime = \Infocyph\InterMix\DI\ContainerBuilder::create("consumer")
                ->value("value", "ok")
                ->build();
            if ($runtime->get("value") !== "ok") {
                throw new RuntimeException("Consumer runtime failed.");
            }
          '
          case "${{ matrix.integration }}" in
            core)
              if composer show infocyph/runwire >/dev/null 2>&1; then
                echo "Core install unexpectedly pulled Runwire." >&2
                exit 1
              fi
              ;;
            cachelayer) php -r 'require "vendor/autoload.php"; exit(class_exists(\Infocyph\CacheLayer\Cache\Cache::class) ? 0 : 1);' ;;
            runwire) php -r 'require "vendor/autoload.php"; exit(class_exists(\Infocyph\Runwire\RuntimeContext::class) ? 0 : 1);' ;;
            opis) php -r 'require "vendor/autoload.php"; exit(class_exists(\Opis\Closure\Serializer::class) ? 0 : 1);' ;;
          esac

  scope:
    name: Swoole/OpenSwoole validation
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/swoole-scope-compatibility.yml
    permissions:
      contents: read
