name: PHPStan Diagnostic

on:
  push:
    branches:
      - perf/di-hot-path

jobs:
  phpstan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: apcu, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php vendor/bin/phpstan analyse --configuration=vendor/infocyph/phpforge/resources/phpstan.neon.dist --memory-limit=1G --no-progress --error-format=table
