name: Batch 1 Diagnostic

on:
  push:
    branches: [perf/di-hot-path]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPStan
        run: php vendor/bin/phpstan analyse --configuration=vendor/infocyph/phpforge/resources/phpstan.neon.dist --memory-limit=1G --no-progress --error-format=table
      - name: PHPProbe comments
        if: always()
        run: php vendor/bin/phpprobe comments --explain src tests
