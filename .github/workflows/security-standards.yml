name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

concurrency:
  group: intermix-security-standards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    with:
      php_extensions: "apcu"
      integration_services: '[]'
      service_topologies: '{}'
    permissions:
      security-events: write
      actions: read
      contents: read


  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout InterMix candidate
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt

      - name: Build documentation with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html


  tag-package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Tagged release package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - name: Validate exact tagged archive
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=tar.gz --output="$RUNNER_TEMP/intermix-release.tar.gz" "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/intermix-release.tar.gz" -C "$RUNNER_TEMP/release"
          for excluded in .github benchmarks docs tests vendor composer.lock; do
            test ! -e "$RUNNER_TEMP/release/$excluded"
          done
          composer install \
            --working-dir="$RUNNER_TEMP/release" \
            --no-dev --no-interaction --prefer-dist --no-progress --classmap-authoritative
          php -r '
            require getenv("RUNNER_TEMP") . "/release/vendor/autoload.php";
            $runtime = \Infocyph\InterMix\DI\ContainerBuilder::create("tag.archive")
                ->value("answer", 42)
                ->build();
            if ($runtime->get("answer") !== 42) {
                throw new RuntimeException("Tagged archive smoke failed.");
            }
          '

  tag-scope:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: "Tagged ${{ matrix.extension }} - PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
        extension: ["openswoole", "swoole"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ${{ matrix.extension }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run exact-tag carrier tests
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp vendor/infocyph/phpforge/resources/pest.xml .phpforge-pest.xml
          trap 'rm -f .phpforge-pest.xml' EXIT
          vendor/bin/pest \
            --configuration=.phpforge-pest.xml \
            tests/Container/SwooleScopeCompatibilityTest.php \
            tests/Container/StructuredScopeRuntimeTest.php

  tag-release-acceptance:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/release-acceptance.yml
    permissions:
      contents: read

  tag-release-candidate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      contents: read

  release:
    needs:
      - phpforge
      - documentation
      - release-regression
      - tag-package
      - tag-scope
      - tag-release-acceptance
      - tag-release-candidate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && success()
    uses: infocyph/phpforge/.github/workflows/release.yml@main
    permissions:
      contents: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  release-regression:
    name: Release regression - PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    steps:
      - name: Checkout InterMix 11.0 candidate
        uses: actions/checkout@v7
        with:
          path: current

      - name: Checkout InterMix 10.1.1 baseline
        uses: actions/checkout@v7
        with:
          repository: infocyph/InterMix
          ref: "f687452b9b8d10333e7beb7d6905b479b2b8480e"
          path: baseline

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        shell: bash
        run: |
          composer install --working-dir=baseline --no-dev --no-interaction --prefer-dist --no-progress --classmap-authoritative
          composer install --working-dir=current --no-dev --no-interaction --prefer-dist --no-progress --classmap-authoritative

      - name: Measure alternating same-runner pairs
        shell: bash
        run: |
          baseline_files=()
          current_files=()

          measure_baseline() {
            local output="$1"
            php current/benchmarks/ReleaseRegression.php \
              --autoload="$GITHUB_WORKSPACE/baseline/vendor/autoload.php" \
              --output="$output"
          }

          measure_current() {
            local output="$1"
            php current/benchmarks/ReleaseRegression.php \
              --autoload="$GITHUB_WORKSPACE/current/vendor/autoload.php" \
              --output="$output"
          }

          for iteration in 1 2 3 4 5; do
            baseline_file="$RUNNER_TEMP/intermix-10.1.1-${{ matrix.php-version }}-$iteration.json"
            current_file="$RUNNER_TEMP/intermix-11.0-${{ matrix.php-version }}-$iteration.json"
            baseline_files+=("$baseline_file")
            current_files+=("$current_file")

            if (( iteration % 2 == 1 )); then
              measure_baseline "$baseline_file"
              measure_current "$current_file"
            else
              measure_current "$current_file"
              measure_baseline "$baseline_file"
            fi
          done

          (IFS=,; echo "INTERMIX_BASELINE_FILES=${baseline_files[*]}" >> "$GITHUB_ENV")
          (IFS=,; echo "INTERMIX_CURRENT_FILES=${current_files[*]}" >> "$GITHUB_ENV")

      - name: Enforce release regression budgets
        shell: bash
        run: |
          php current/benchmarks/ReleaseRegression.php \
            --compare-baseline="$INTERMIX_BASELINE_FILES" \
            --compare-current="$INTERMIX_CURRENT_FILES" \
            --max-sequential=3 \
            --max-fiber=5

      - name: Upload release regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intermix-release-regression-php-${{ matrix.php-version }}
          path: |
            ${{ runner.temp }}/intermix-10.1.1-${{ matrix.php-version }}-*.json
            ${{ runner.temp }}/intermix-11.0-${{ matrix.php-version }}-*.json
          retention-days: 61
